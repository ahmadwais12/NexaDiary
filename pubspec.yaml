name: note_app
description: "Your private digital workspace — no account required."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  uuid: ^4.6.0
  file_picker: ^12.0.0
  open_filex: ^4.7.0
  mime: ^2.0.0
  share_plus: ^13.3.0
  permission_handler: ^13.0.1
  go_router: ^17.5.0
  intl: 0.20.2
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  flutter_slidable: ^4.0.3
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.1
  photo_manager: ^3.12.0
  video_player: ^2.11.1
  just_audio: ^0.10.6
  screen_brightness: ^2.1.4
  image_picker: ^1.2.3
  record: ^6.2.1
  local_auth: ^3.0.2
  provider: ^6.1.5+1
  hijri_calendar: ^1.0.7+7
  shamsi_date: ^1.1.1
  in_app_review: ^2.0.10
  url_launcher: ^6.3.1
  alarm: ^5.12.0

dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/NexaDiary_mark.png"
  adaptive_icon_background: "#635BFF"
  adaptive_icon_foreground: "assets/logo/NexaDiary_mark.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/NexaDiary.png
    - assets/logo/NexaDiary_mark.png
